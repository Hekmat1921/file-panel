<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیر</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg-1: #0f172a;
  --bg-2: #1e293b;
  --card: rgba(255,255,255,0.08);
  --card-border: rgba(255,255,255,0.15);
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --primary: #6366f1;
  --primary-2: #8b5cf6;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --shadow: 0 20px 60px rgba(0,0,0,0.4);
}
[data-theme="light"] {
  --bg-1: #e0e7ff;
  --bg-2: #f0f9ff;
  --card: rgba(255,255,255,0.75);
  --card-border: rgba(99,102,241,0.15);
  --text: #1e293b;
  --text-muted: #64748b;
  --shadow: 0 20px 60px rgba(99,102,241,0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Vazirmatn', Tahoma, sans-serif;
  min-height: 100vh;
  color: var(--text);
  background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
  background-attachment: fixed;
  padding: 20px;
  transition: background 0.4s ease, color 0.4s ease;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  top: -50%; right: -20%;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(99,102,241,0.35), transparent 70%);
  border-radius: 50%;
  animation: float 15s ease-in-out infinite;
  z-index: -1;
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  bottom: -30%; left: -10%;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(139,92,246,0.3), transparent 70%);
  border-radius: 50%;
  animation: float 20s ease-in-out infinite reverse;
  z-index: -1;
  pointer-events: none;
}
@keyframes float {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(60px,-40px) scale(1.15); }
}

.theme-toggle {
  position: fixed;
  top: 20px; left: 20px;
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--card-border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: var(--text);
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: all 0.3s ease;
}
.theme-toggle:hover { transform: rotate(180deg) scale(1.1); }

/* ===== Login ===== */
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-card {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  border: 1px solid var(--card-border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 40px 32px;
  box-shadow: var(--shadow);
  animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}
.login-logo {
  width: 80px; height: 80px;
  margin: 0 auto 20px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  color: #fff;
  box-shadow: 0 10px 30px rgba(99,102,241,0.4);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 10px 30px rgba(99,102,241,0.4); }
  50% { box-shadow: 0 10px 40px rgba(139,92,246,0.7); }
}
.login-card h2 { text-align: center; margin-bottom: 8px; font-size: 24px; font-weight: 700; }
.login-card p.sub { text-align: center; color: var(--text-muted); margin-bottom: 28px; font-size: 14px; }

.field { margin-bottom: 18px; position: relative; }
.field label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
.field .input-wrap { position: relative; }
.field i { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 15px; pointer-events: none; }
.field input, .field textarea, .field select {
  width: 100%;
  padding: 14px 44px 14px 16px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  transition: all 0.3s ease;
}
[data-theme="light"] .field input,
[data-theme="light"] .field textarea,
[data-theme="light"] .field select { background: rgba(255,255,255,0.9); }
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
  background: rgba(255,255,255,0.1);
}
.field input::placeholder, .field textarea::placeholder { color: var(--text-muted); opacity: 0.6; }

.btn {
  padding: 13px 22px;
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  box-shadow: 0 8px 24px rgba(99,102,241,0.35);
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(99,102,241,0.5); }
.btn:active { transform: translateY(0); }
.btn.block { width: 100%; }
.btn.ghost { background: rgba(255,255,255,0.08); border: 1px solid var(--card-border); box-shadow: none; color: var(--text); }
.btn.ghost:hover { background: rgba(255,255,255,0.15); }
.btn.danger { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 8px 24px rgba(239,68,68,0.35); }
.btn.sm { padding: 8px 14px; font-size: 12px; }
.btn.icon-only { padding: 8px 10px; }

/* ===== Panel ===== */
.panel-wrap { max-width: 1100px; margin: 0 auto; padding: 20px 20px 60px; animation: fadeIn 0.6s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 24px;
  background: var(--card);
  border: 1px solid var(--card-border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 20px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.topbar .user-info { display: flex; align-items: center; gap: 14px; }
.avatar {
  width: 46px; height: 46px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 18px;
}
.topbar .user-info .name { font-weight: 700; font-size: 15px; }
.topbar .user-info .role { font-size: 12px; color: var(--text-muted); }

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  background: var(--card);
  padding: 8px;
  border-radius: 16px;
  border: 1px solid var(--card-border);
  backdrop-filter: blur(20px);
}
.tab {
  flex: 1;
  padding: 12px 20px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.tab.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: #fff;
  box-shadow: 0 6px 20px rgba(99,102,241,0.4);
}

.card-box {
  background: var(--card);
  border: 1px solid var(--card-border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.card-box h3 {
  margin-bottom: 18px;
  font-size: 17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}
.card-box h3 i { color: var(--primary); }

.user-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 18px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  margin-bottom: 10px;
  transition: all 0.3s;
  cursor: pointer;
}
.user-card:hover {
  background: rgba(99,102,241,0.1);
  border-color: var(--primary);
  transform: translateX(-4px);
}
.user-card .user-left { display: flex; align-items: center; gap: 14px; }
.user-card .avatar-sm {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 16px;
}
.user-card .name { font-weight: 700; font-size: 14px; }
.user-card .meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.user-card .actions { display: flex; gap: 6px; }

.empty {
  text-align: center;
  color: var(--text-muted);
  padding: 50px 20px;
  font-size: 14px;
}
.empty i { font-size: 48px; opacity: 0.3; display: block; margin-bottom: 14px; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 500;
  padding: 20px;
  animation: fadeIn 0.3s ease;
}
.modal {
  width: 100%;
  max-width: 440px;
  background: var(--card);
  border: 1px solid var(--card-border);
  backdrop-filter: blur(30px);
  border-radius: 24px;
  padding: 30px;
  box-shadow: var(--shadow);
  animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-height: 90vh;
  overflow-y: auto;
}
.modal h3 { margin-bottom: 20px; font-size: 20px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions .btn { flex: 1; }

/* ===== File Item ===== */
.file-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  margin-bottom: 8px;
  transition: all 0.2s;
}
.file-item:hover { background: rgba(255,255,255,0.08); }
.file-item .file-name { font-size: 13px; font-weight: 600; word-break: break-all; }
.file-item .file-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.file-item a {
  color: var(--success);
  font-size: 18px;
  text-decoration: none;
  transition: transform 0.2s;
}
.file-item a:hover { transform: scale(1.2); }

.desc-item {
  background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(245,158,11,0.05));
  border-right: 4px solid var(--warning);
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 8px;
  line-height: 1.7;
}

.toast-container {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 999;
}
.toast {
  padding: 14px 22px;
  background: var(--card);
  border: 1px solid var(--card-border);
  backdrop-filter: blur(20px);
  border-radius: 14px;
  box-shadow: var(--shadow);
  color: var(--text);
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  min-width: 260px;
}
.toast.success { border-color: var(--success); }
.toast.success i { color: var(--success); }
.toast.error { border-color: var(--danger); }
.toast.error i { color: var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
.toast.out { animation: toastOut 0.3s ease forwards; }
@keyframes toastOut { to { opacity: 0; transform: translateY(30px); } }

.hidden { display: none !important; }
@media (max-width: 600px) {
  .topbar { padding: 14px 16px; flex-wrap: wrap; gap: 10px; }
  .user-card { flex-direction: column; align-items: flex-start; gap: 10px; }
  .user-card .actions { width: 100%; justify-content: flex-end; }
}
</style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" title="تغییر تم">
  <i class="fas fa-moon" id="themeIcon"></i>
</button>

<!-- ===== Login ===== -->
<div id="loginSection" class="login-wrap">
  <div class="login-card">
    <div class="login-logo"><i class="fas fa-crown"></i></div>
    <h2>ورود مدیر</h2>
    <p class="sub">دسترسی محدود به مدیر سیستم</p>

    <div class="field">
      <label>نام کاربری</label>
      <div class="input-wrap">
        <input type="text" id="adminUser" placeholder="نام کاربری">
        <i class="fas fa-user"></i>
      </div>
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <div class="input-wrap">
        <input type="password" id="adminPass" placeholder="رمز عبور" onkeydown="if(event.key==='Enter')adminLogin()">
        <i class="fas fa-lock"></i>
      </div>
    </div>
    <button class="btn block" onclick="adminLogin()"><i class="fas fa-sign-in-alt"></i> ورود</button>
  </div>
</div>

<!-- ===== Panel ===== -->
<div id="panelSection" class="panel-wrap hidden">
  <div class="topbar">
    <div class="user-info">
      <div class="avatar"><i class="fas fa-crown"></i></div>
      <div>
        <div class="name">مدیر سیستم</div>
        <div class="role">دسترسی کامل</div>
      </div>
    </div>
    <button class="btn sm ghost" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabUsers" onclick="showTab('users')"><i class="fas fa-users"></i> کاربران</button>
    <button class="tab" id="tabProfile" onclick="showTab('profile')"><i class="fas fa-folder-open"></i> پروفایل کاربر</button>
  </div>

  <div id="usersSection">
    <div class="card-box">
      <h3><i class="fas fa-user-plus"></i> افزودن کاربر جدید</h3>
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px;">
        <div class="field" style="margin:0;">
          <label>نام کامل</label>
          <div class="input-wrap"><input type="text" id="newUserName" placeholder="مثلاً علی رضایی"><i class="fas fa-user"></i></div>
        </div>
        <div class="field" style="margin:0;">
          <label>شماره تماس</label>
          <div class="input-wrap"><input type="text" id="newUserPhone" placeholder="اختیاری"><i class="fas fa-phone"></i></div>
        </div>
        <div class="field" style="margin:0;">
          <label>نام کاربری</label>
          <div class="input-wrap"><input type="text" id="newUserUsername" placeholder="یکتا"><i class="fas fa-at"></i></div>
        </div>
        <div class="field" style="margin:0;">
          <label>رمز عبور</label>
          <div class="input-wrap"><input type="password" id="newUserPass" placeholder="رمز"><i class="fas fa-lock"></i></div>
        </div>
      </div>
      <button class="btn" style="margin-top:14px;" onclick="addUser()"><i class="fas fa-plus"></i> افزودن کاربر</button>
    </div>

    <div class="card-box">
      <h3><i class="fas fa-users"></i> لیست کاربران</h3>
      <div id="usersList"></div>
    </div>
  </div>

  <div id="profileSection" class="hidden">
    <div class="card-box">
      <h3><i class="fas fa-id-card"></i> <span id="profileName"></span></h3>
      <p id="profileInfo" style="color:var(--text-muted); margin-bottom:18px; font-size:13px;"></p>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn sm" onclick="editCurrentUser()"><i class="fas fa-edit"></i> ویرایش</button>
        <button class="btn sm danger" onclick="deleteCurrentUser()"><i class="fas fa-trash"></i> حذف</button>
      </div>
    </div>

    <div class="card-box">
      <h3><i class="fas fa-hashtag"></i> انتخاب شماره پرونده</h3>
      <div class="field" style="margin:0;">
        <div class="input-wrap">
          <select id="caseSelect" onchange="renderCaseFiles()">
            <option value="">-- پرونده‌ای وجود ندارد --</option>
          </select>
          <i class="fas fa-folder"></i>
        </div>
      </div>
    </div>

    <div id="caseContent"></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<div id="modalContainer"></div>

<script>
/* ============================================================
   ⚙️ نام کاربری و رمز ادمین — همین‌جا عوض کنید
   ============================================================ */
const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "1234";
/* ============================================================ */

let currentUserId = null;

/* ===== Theme ===== */
function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  html.setAttribute('data-theme', isLight ? 'dark' : 'light');
  document.getElementById('themeIcon').className = isLight ? 'fas fa-moon' : 'fas fa-sun';
  localStorage.setItem('theme', isLight ? 'dark' : 'light');
}
(function initTheme() {
  const t = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeIcon').className = t === 'light' ? 'fas fa-sun' : 'fas fa-moon';
})();

/* ===== Toast ===== */
function toast(msg, type='success') {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':'exclamation-circle'}"></i> <span>${msg}</span>`;
  c.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(()=>el.remove(), 300); }, 3000);
}

/* ===== Modal ===== */
function openModal(title, bodyHTML, onConfirm) {
  const c = document.getElementById('modalContainer');
  c.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>${title}</h3>
        <div id="modalBody">${bodyHTML}</div>
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeModal()">انصراف</button>
          <button class="btn" id="modalConfirm">تأیید</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalConfirm').onclick = () => {
    if (onConfirm() !== false) closeModal();
  };
  setTimeout(() => c.querySelector('input, textarea')?.focus(), 100);
}
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

/* ===== DB ===== */
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('fileDB', 2);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('users')) db.createObjectStore('users', { keyPath: 'id', autoIncrement: true });
      if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = e => res(e.target.result);
    req.onerror = e => rej(e.target.error);
  });
}

/* ===== Login ===== */
function adminLogin() {
  const u = document.getElementById('adminUser').value.trim();
  const p = document.getElementById('adminPass').value;
  if (!u || !p) { toast('نام کاربری و رمز را وارد کنید', 'error'); return; }

  if (u === ADMIN_USERNAME && p === ADMIN_PASSWORD) {
    sessionStorage.setItem('adminLoggedIn', '1');
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('panelSection').classList.remove('hidden');
    document.getElementById('adminUser').value = '';
    document.getElementById('adminPass').value = '';
    loadUsers();
    toast('خوش آمدید مدیر');
  } else {
    toast('نام کاربری یا رمز اشتباه است', 'error');
  }
}
function adminLogout() {
  sessionStorage.removeItem('adminLoggedIn');
  document.getElementById('panelSection').classList.add('hidden');
  document.getElementById('loginSection').classList.remove('hidden');
  currentUserId = null;
}

/* ===== Tabs ===== */
function showTab(name) {
  document.getElementById('tabUsers').classList.toggle('active', name==='users');
  document.getElementById('tabProfile').classList.toggle('active', name==='profile');
  document.getElementById('usersSection').classList.toggle('hidden', name!=='users');
  document.getElementById('profileSection').classList.toggle('hidden', name!=='profile');
}

/* ===== Users ===== */
async function loadUsers() {
  const db = await openDB();
  const tx = db.transaction(['users','files'], 'readonly');
  const usersReq = tx.objectStore('users').getAll();
  const filesReq = tx.objectStore('files').getAll();

  tx.oncomplete = () => {
    const users = usersReq.result;
    const files = filesReq.result;
    const list = document.getElementById('usersList');

    if (!users.length) {
      list.innerHTML = '<div class="empty"><i class="fas fa-users-slash"></i>هیچ کاربری ثبت نشده است</div>';
      return;
    }

    list.innerHTML = users.map(u => {
      const count = files.filter(f => f.userId === u.id).length;
      return `
        <div class="user-card" onclick="openProfile(${u.id})">
          <div class="user-left">
            <div class="avatar-sm">${u.name.charAt(0)}</div>
            <div>
              <div class="name">${u.name}</div>
              <div class="meta">
                <i class="fas fa-at"></i> ${u.username || '-'}
                ${u.phone ? ` &nbsp; <i class="fas fa-phone"></i> ${u.phone}` : ''}
                &nbsp; <i class="fas fa-file"></i> ${count} فایل
              </div>
            </div>
          </div>
          <div class="actions" onclick="event.stopPropagation()">
            <button class="btn sm icon-only" onclick="editUser(${u.id})" title="ویرایش"><i class="fas fa-edit"></i></button>
            <button class="btn sm danger icon-only" onclick="deleteUser(${u.id})" title="حذف"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      `;
    }).join('');
  };
}

async function addUser() {
  const name = document.getElementById('newUserName').value.trim();
  const phone = document.getElementById('newUserPhone').value.trim();
  const username = document.getElementById('newUserUsername').value.trim();
  const password = document.getElementById('newUserPass').value;

  if (!name || !username || !password) { toast('نام، نام کاربری و رمز الزامی است', 'error'); return; }

  const db = await openDB();
  const checkTx = db.transaction('users', 'readonly');
  const all = checkTx.objectStore('users').getAll();
  all.onsuccess = () => {
    if (all.result.some(u => u.username === username)) { toast('این نام کاربری قبلاً گرفته شده', 'error'); return; }
    const tx = db.transaction('users', 'readwrite');
    tx.objectStore('users').add({ name, phone, username, password, date: new Date().toLocaleString('fa-IR') });
    tx.oncomplete = () => {
      ['newUserName','newUserPhone','newUserUsername','newUserPass'].forEach(id => document.getElementById(id).value = '');
      toast('کاربر با موفقیت اضافه شد');
      loadUsers();
    };
  };
}

async function editUser(id) {
  const db = await openDB();
  const tx = db.transaction('users', 'readonly');
  const req = tx.objectStore('users').get(id);
  req.onsuccess = () => {
    const u = req.result;
    openModal('ویرایش کاربر', `
      <div class="field"><label>نام</label><div class="input-wrap"><input id="eu_name" value="${u.name}" placeholder="نام"><i class="fas fa-user"></i></div></div>
      <div class="field"><label>شماره تماس</label><div class="input-wrap"><input id="eu_phone" value="${u.phone||''}" placeholder="اختیاری"><i class="fas fa-phone"></i></div></div>
      <div class="field"><label>نام کاربری</label><div class="input-wrap"><input id="eu_username" value="${u.username||''}" placeholder="یکتا"><i class="fas fa-at"></i></div></div>
      <div class="field"><label>رمز جدید (خالی = بدون تغییر)</label><div class="input-wrap"><input id="eu_pass" type="password" placeholder="رمز جدید"><i class="fas fa-lock"></i></div></div>
    `, async () => {
      const name = document.getElementById('eu_name').value.trim();
      const phone = document.getElementById('eu_phone').value.trim();
      const username = document.getElementById('eu_username').value.trim();
      const pass = document.getElementById('eu_pass').value;
      if (!name || !username) { toast('نام و نام کاربری الزامی است', 'error'); return false; }

      const db2 = await openDB();
      const chk = db2.transaction('users','readonly').objectStore('users').getAll();
      chk.onsuccess = () => {
        if (chk.result.some(x => x.username === username && x.id !== id)) { toast('این نام کاربری قبلاً گرفته شده', 'error'); return; }
        const updated = { ...u, name, phone, username };
        if (pass.trim()) updated.password = pass.trim();
        const t = db2.transaction('users','readwrite');
        t.objectStore('users').put(updated);
        t.oncomplete = () => { toast('ویرایش شد'); loadUsers(); if (currentUserId === id) openProfile(id); };
      };
    });
  };
}

async function deleteUser(id) {
  openModal('حذف کاربر', '<p style="color:var(--text-muted);">آیا از حذف این کاربر و همه فایل‌هایش مطمئن هستید؟ این عمل قابل بازگشت نیست.</p>', async () => {
    const db = await openDB();
    const tx = db.transaction(['users','files'], 'readwrite');
    tx.objectStore('users').delete(id);
    const filesReq = tx.objectStore('files').getAll();
    filesReq.onsuccess = () => {
      filesReq.result.filter(f => f.userId === id).forEach(f => tx.objectStore('files').delete(f.id));
    };
    tx.oncomplete = () => {
      if (currentUserId === id) { currentUserId = null; showTab('users'); }
      toast('کاربر حذف شد');
      loadUsers();
    };
  });
}

/* ===== Profile ===== */
async function openProfile(id) {
  currentUserId = id;
  showTab('profile');
  const db = await openDB();
  const tx = db.transaction(['users','files'], 'readonly');
  const userReq = tx.objectStore('users').get(id);
  const filesReq = tx.objectStore('files').getAll();

  tx.oncomplete = () => {
    const user = userReq.result;
    const files = filesReq.result.filter(f => f.userId === id);
    document.getElementById('profileName').textContent = user.name;
    document.getElementById('profileInfo').innerHTML =
      `<i class="fas fa-at"></i> ${user.username || '-'}` +
      (user.phone ? ` &nbsp; <i class="fas fa-phone"></i> ${user.phone}` : '') +
      ` &nbsp; <i class="fas fa-calendar"></i> ${user.date || '-'}` +
      ` &nbsp; <i class="fas fa-file"></i> ${files.length} فایل`;

    const cases = [...new Set(files.map(f => f.caseNumber))].sort((a,b)=>a-b);
    const sel = document.getElementById('caseSelect');
    if (!cases.length) sel.innerHTML = '<option value="">پرونده‌ای وجود ندارد</option>';
    else sel.innerHTML = '<option value="">-- انتخاب کنید --</option>' +
      cases.map(c => `<option value="${c}">شماره پرونده ${c}</option>`).join('');
    document.getElementById('caseContent').innerHTML = '<div class="card-box"><div class="empty"><i class="fas fa-hand-pointer"></i>یک شماره پرونده را انتخاب کنید</div></div>';
  };
}

async function renderCaseFiles() {
  if (!currentUserId) return;
  const caseNo = document.getElementById('caseSelect').value;
  const content = document.getElementById('caseContent');
  if (!caseNo) { content.innerHTML = '<div class="card-box"><div class="empty"><i class="fas fa-hand-pointer"></i>یک شماره پرونده را انتخاب کنید</div></div>'; return; }

  const db = await openDB();
  const tx = db.transaction('files', 'readonly');
  const req = tx.objectStore('files').getAll();

  req.onsuccess = () => {
    const files = req.result.filter(f => f.userId === currentUserId && String(f.caseNumber) === caseNo);
    const byType = {};
    files.forEach(f => { if (!byType[f.type]) byType[f.type] = []; byType[f.type].push(f); });

    let html = '';
    if (!files.length) html = '<div class="card-box"><div class="empty">فایلی برای این پرونده نیست</div></div>';

    const icons = {
      'باهم‌های اینویس': 'fa-box-open',
      'پکینگ': 'fa-boxes-stacked',
      'سمیر': 'fa-clipboard-list',
      'اینویس جایگزین': 'fa-file-invoice',
      'پکینگ جایگزین': 'fa-box'
    };

    Object.keys(byType).forEach(type => {
      html += `<div class="card-box"><h3><i class="fas ${icons[type]||'fa-file'}"></i> ${type}</h3>`;
      byType[type].forEach(f => {
        html += `<div class="file-item">
          <div>
            <div class="file-name">${f.fileName}</div>
            <div class="file-meta">${(f.fileSize/1024).toFixed(1)} KB — ${f.date}</div>
          </div>
          <a href="#" data-id="${f.id}" class="dl" title="دانلود"><i class="fas fa-download"></i></a>
        </div>`;
      });
      html += `</div>`;
    });

    const descs = [...new Set(files.map(f => f.description).filter(Boolean))];
    if (descs.length) {
      html += `<div class="card-box"><h3><i class="fas fa-comment-dots"></i> توضیحات این پرونده</h3>`;
      descs.forEach(d => html += `<div class="desc-item">${d}</div>`);
      html += `</div>`;
    }

    content.innerHTML = html;

    document.querySelectorAll('.dl').forEach(a => {
      a.onclick = async e => {
        e.preventDefault();
        const id = Number(a.dataset.id);
        const db2 = await openDB();
        const tx2 = db2.transaction('files', 'readonly');
        const r = tx2.objectStore('files').get(id);
        r.onsuccess = () => {
          const f = r.result;
          const url = URL.createObjectURL(f.fileBlob);
          const l = document.createElement('a');
          l.href = url; l.download = f.fileName; l.click();
          URL.revokeObjectURL(url);
          toast('دانلود شروع شد');
        };
      };
    });
  };
}

async function editCurrentUser() { if (currentUserId) editUser(currentUserId); }
async function deleteCurrentUser() { if (currentUserId) deleteUser(currentUserId); }

/* ===== Auto-login ===== */
if (sessionStorage.getItem('adminLoggedIn') === '1') {
  document.getElementById('loginSection').classList.add('hidden');
  document.getElementById('panelSection').classList.remove('hidden');
  loadUsers();
}
</script>
